name: backend

# Developer A zone. Runs only on changes in pipeline/, backend/ or contract/,
# so a failure here does not block frontend PRs.
# Steps are skipped while the folder has no pyproject.toml; developer A will set them up.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pipeline — linter and tests
        if: hashFiles('pipeline/pyproject.toml') != ''
        working-directory: pipeline
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q

      - name: backend — linter and tests
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
