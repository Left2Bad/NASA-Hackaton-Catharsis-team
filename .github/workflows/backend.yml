name: backend

# Зона разработчика A. Запускается только при изменениях в pipeline/, backend/ или contract/,
# поэтому поломка здесь не блокирует PR фронтенда.
# Шаги пропускаются, пока в папке нет pyproject.toml, — разработчик A настроит их под себя.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pipeline — линтер и тесты
        if: hashFiles('pipeline/pyproject.toml') != ''
        working-directory: pipeline
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q

      - name: backend — линтер и тесты
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
