name: backend

# Developer A zone. Runs only on changes in pipeline/, backend/, contract/ or the pinned versions,
# so a failure here does not block frontend PRs.
# Installs with constraints.txt (the exact versions the tests pass with) on every supported Python.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - "constraints.txt"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "backend/**"
      - "contract/**"
      - "constraints.txt"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]  # pyproject: requires-python >= 3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: pipeline — linter and tests
        working-directory: pipeline
        run: |
          pip install -c ../constraints.txt -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q

      - name: backend — linter and tests
        working-directory: backend
        run: |
          pip install -c ../constraints.txt -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest -q
