name: contract

# Общая зона. Проверяет, что openapi.yaml корректен и примеры ему соответствуют.

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости проверки
        run: pip install -r contract/tools/requirements.txt
      - name: Проверить контракт и примеры
        run: python contract/tools/validate.py
