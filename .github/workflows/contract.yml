name: contract

# API contract, shared by both sides. Checks that openapi.yaml is valid and the examples match it.

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contract/**"
      - ".github/workflows/contract.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -r contract/tools/requirements.txt
      - name: Validate the contract and examples
        run: python contract/tools/validate.py
