name: frontend

# Zone of developer B. Runs only when frontend/ or contract/ change,
# so a failure here does not block backend pull requests.
# The steps are skipped while the folder has no package.json.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install, lint, test, build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build
