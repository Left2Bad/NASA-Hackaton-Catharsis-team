name: frontend

# Зона разработчика B. Запускается только при изменениях в frontend/ или contract/,
# поэтому поломка здесь не блокирует PR бэкенда.
# Шаги пропускаются, пока в папке нет package.json, — разработчик B настроит их под себя.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установка, линтер, тесты, сборка
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build
