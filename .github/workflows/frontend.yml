name: frontend

# Zone of developer B. Runs only when frontend/ or contract/ change,
# so a failure here does not block backend pull requests.
# The steps are skipped while the folder has no package.json.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contract/**"
      - ".github/workflows/frontend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install, lint, test, build
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build

      # End-to-end tests: a real browser walks the main scenario through the built app,
      # which runs on the saved answers of the real API (no backend, no data files).
      - name: End-to-end tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Keep the report of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
