[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burn-calendar-api"
version = "0.1.0"
description = "Burn Calendar API: harmonized MODIS + VIIRS hotspot calendar (contract/openapi.yaml)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",  # serves contract/openapi.yaml at /api/v1/openapi.json
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "httpx>=0.27", "jsonschema[format]>=4.21", "pyyaml>=6.0"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
