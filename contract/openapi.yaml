openapi: 3.1.0
info:
  title: Burn Calendar API
  version: 0.2.0
  summary: Fire activity calendar on the harmonized MODIS + VIIRS record
  description: |
    Contract between the backend (zone A) and the frontend (zone B).

    Conventions:
    - field names in `snake_case`;
    - dates in ISO 8601 (`YYYY-MM-DD`), times in UTC;
    - coordinates in GeoJSON order: longitude first, then latitude;
    - months are numbered 1–12;
    - values of the harmonized record are expressed in "VIIRS Suomi NPP equivalent";
    - a missing value is sent as `null`, not by omitting the field;
    - human-readable texts (`message`, `label`, `name`, `description`, `limitations`) come from the server
      in a single language; identifiers (`id`, `code`, enum values) are stable, so the client
      can show its own translation keyed by them and use the server text as a fallback.

    The rules for changing the contract are in `contract/README.md`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local run
tags:
  - name: service
    description: Service endpoints
  - name: analytics
    description: Calendar and analytics for an area
  - name: export
    description: File exports
  - name: method
    description: Data for the "Method" page

paths:
  /health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Check that the service is alive
      responses:
        "200":
          description: The service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /meta:
    get:
      tags: [service]
      operationId: getMeta
      summary: Date range, grid step, limits and example areas
      responses:
        "200":
          description: Dataset metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /calendar:
    post:
      tags: [analytics]
      operationId: postCalendar
      summary: Monthly "year × month" grid, medians, yearly totals and a summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaQuery"
      responses:
        "200":
          description: Calendar for the area. An area without fires is also 200, with zero values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /current:
    post:
      tags: [analytics]
      operationId: postCurrent
      summary: The current month since its start against the same days of past years
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaQuery"
      responses:
        "200":
          description: State of the current month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /points:
    post:
      tags: [analytics]
      operationId: postPoints
      summary: Points of one month for the map (priority "nice to have")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsQuery"
      responses:
        "200":
          description: Points in GeoJSON. If there are more points than the limit, `truncated` = true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /daily:
    post:
      tags: [analytics]
      operationId: postDaily
      summary: Daily values of one year (priority "if time allows")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyQuery"
      responses:
        "200":
          description: Value of the harmonized record for every day of the year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /export/points.csv:
    post:
      tags: [export]
      operationId: exportPointsCsv
      summary: Export of the hot spots for the request as CSV
      description: |
        Columns: `lat, lon, acq_datetime, sensor, satellite, conf_class, frp, daynight,
        pixel_km2, type, quality, harmonized_weight`. Example: `examples/export_points.csv`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPointsQuery"
      responses:
        "200":
          description: CSV file (UTF-8, comma-separated, the first row is the header)
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="hotspots.csv"
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /export/calendar.csv:
    post:
      tags: [export]
      operationId: exportCalendarCsv
      summary: Export of the monthly calendar table as CSV
      description: |
        Columns: `year, month, value, low, high, median, anomaly_pct, percentile, category,
        source, preliminary, partial`. Example: `examples/export_calendar.csv`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaQuery"
      responses:
        "200":
          description: CSV file (UTF-8, comma-separated, the first row is the header)
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NoData"
        "413":
          $ref: "#/components/responses/TooLarge"

  /method/validation:
    get:
      tags: [method]
      operationId: getMethodValidation
      summary: Metrics and series of the harmonization check for the "Method" page
      responses:
        "200":
          description: Quality check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"

components:
  responses:
    BadRequest:
      description: Invalid request. Code `INVALID_GEOMETRY` or `INVALID_REQUEST`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoData:
      description: The area is outside the dataset coverage. Code `NO_DATA`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooLarge:
      description: The request is too large. Code `AREA_TOO_LARGE` or `EXPORT_TOO_LARGE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ---------- Common types ----------
    Position:
      description: GeoJSON coordinate — [longitude, latitude]
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: number
          minimum: -180
          maximum: 180
        - type: number
          minimum: -90
          maximum: 90

    LinearRing:
      description: A closed ring — the first and the last points are the same
      type: array
      minItems: 4
      items:
        $ref: "#/components/schemas/Position"

    Polygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LinearRing"

    MultiPolygon:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              $ref: "#/components/schemas/LinearRing"

    Geometry:
      description: Area of interest — a GeoJSON Polygon or MultiPolygon
      oneOf:
        - $ref: "#/components/schemas/Polygon"
        - $ref: "#/components/schemas/MultiPolygon"

    YearRange:
      type: object
      additionalProperties: false
      required: [start_year, end_year]
      properties:
        start_year:
          type: integer
          minimum: 2000
        end_year:
          type: integer
          minimum: 2000

    Metric:
      description: "`count` — number of hot spots, `frp` — total fire radiative power, MW"
      type: string
      enum: [count, frp]

    Series:
      description: |
        `harmonized` — the harmonized record. `raw` — the `raw` field is also filled
        with the original sensor values; `value` still holds the harmonized value.
      type: string
      enum: [harmonized, raw]

    Source:
      description: |
        Lead source of the harmonized record in this period:
        `MODIS_T` — Terra only (until July 2002), `MODIS_TA` — Terra + Aqua,
        `VIIRS_SNPP` — Suomi NPP (reference), `VIIRS_N20` — NOAA-20.
      type: string
      enum: [MODIS_T, MODIS_TA, VIIRS_SNPP, VIIRS_N20]

    Category:
      description: |
        Position of the value among the same periods of the baseline years:
        below the 25th percentile — `below_normal`, 25–75 — `normal`, 75–90 — `above_normal`,
        above 90 — `high`, above the baseline maximum — `record`.
      type: string
      enum: [below_normal, normal, above_normal, high, record]

    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [AREA_SMALL, PRELIMINARY_DATA, SENSOR_GAP, PARTIAL_COVERAGE]
        message:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_GEOMETRY
                - INVALID_REQUEST
                - AREA_TOO_LARGE
                - EXPORT_TOO_LARGE
                - NO_DATA
                - INTERNAL
            message:
              type: string

    # ---------- Requests ----------
    AreaQuery:
      description: Common request body — area, period and series parameters
      type: object
      additionalProperties: false
      required: [geometry]
      properties:
        geometry:
          $ref: "#/components/schemas/Geometry"
        start_year:
          description: First year of the period. Defaults to the first year of the dataset.
          type: integer
          minimum: 2000
        end_year:
          description: Last year of the period. Defaults to the current year.
          type: integer
          minimum: 2000
        baseline:
          description: Baseline period for the medians. Defaults to all complete years since 2001.
          $ref: "#/components/schemas/YearRange"
        metric:
          $ref: "#/components/schemas/Metric"
          default: count
        series:
          $ref: "#/components/schemas/Series"
          default: harmonized

    PointsQuery:
      type: object
      additionalProperties: false
      required: [geometry, year, month]
      properties:
        geometry:
          $ref: "#/components/schemas/Geometry"
        year:
          type: integer
          minimum: 2000
        month:
          type: integer
          minimum: 1
          maximum: 12

    DailyQuery:
      type: object
      additionalProperties: false
      required: [geometry, year]
      properties:
        geometry:
          $ref: "#/components/schemas/Geometry"
        year:
          type: integer
          minimum: 2000
        metric:
          $ref: "#/components/schemas/Metric"
          default: count

    ExportPointsQuery:
      type: object
      additionalProperties: false
      required: [geometry, start_date, end_date]
      properties:
        geometry:
          $ref: "#/components/schemas/Geometry"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date

    # ---------- Responses ----------
    Health:
      type: object
      additionalProperties: false
      required: [status, data_version]
      properties:
        status:
          const: ok
        data_version:
          description: Dataset version, changes with every pipeline rerun
          type: string

    SourceInfo:
      type: object
      additionalProperties: false
      required: [id, label, start, end]
      properties:
        id:
          $ref: "#/components/schemas/Source"
        label:
          type: string
        start:
          description: First day on which the source leads the harmonized record
          type: string
          format: date
        end:
          description: Last day; `null` — the source leads the record now
          type: [string, "null"]
          format: date

    Preset:
      type: object
      additionalProperties: false
      required: [id, name, geometry]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        geometry:
          $ref: "#/components/schemas/Geometry"

    Limits:
      type: object
      additionalProperties: false
      required: [max_area_km2, min_cells_warning, max_export_rows, max_points]
      properties:
        max_area_km2:
          description: Requests over this area are rejected with `AREA_TOO_LARGE`
          type: number
        min_cells_warning:
          description: Below this number of grid cells the response has the `AREA_SMALL` warning
          type: integer
        max_export_rows:
          description: Exports over this number of rows are rejected with `EXPORT_TOO_LARGE`
          type: integer
        max_points:
          description: Maximum number of points in a `/points` response
          type: integer

    Coverage:
      type: object
      additionalProperties: false
      required: [global, regions]
      properties:
        global:
          description: true — data are loaded for the whole world
          type: boolean
        regions:
          description: Names of the loaded countries when the coverage is not global
          type: array
          items:
            type: string

    Meta:
      type: object
      additionalProperties: false
      required:
        - data_version
        - unit
        - grid_deg
        - first_date
        - last_date
        - last_standard_date
        - sources
        - limits
        - coverage
        - presets
      properties:
        data_version:
          type: string
        unit:
          description: Unit of the harmonized record values
          type: string
        grid_deg:
          description: Grid step in degrees
          type: number
        first_date:
          type: string
          format: date
        last_date:
          description: Last day with data
          type: string
          format: date
        last_standard_date:
          description: Last day with standard processing; later data are preliminary
          type: string
          format: date
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceInfo"
        limits:
          $ref: "#/components/schemas/Limits"
        coverage:
          $ref: "#/components/schemas/Coverage"
        presets:
          type: array
          items:
            $ref: "#/components/schemas/Preset"

    RawValues:
      description: Original sensor values without harmonization; `null` — the sensor was not operating in this period
      type: object
      additionalProperties: false
      required: [modis, viirs_snpp, viirs_n20]
      properties:
        modis:
          type: [number, "null"]
        viirs_snpp:
          type: [number, "null"]
        viirs_n20:
          type: [number, "null"]

    MonthValue:
      type: object
      additionalProperties: false
      required:
        - year
        - month
        - value
        - low
        - high
        - median
        - anomaly_pct
        - percentile
        - category
        - source
        - preliminary
        - partial
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        value:
          description: Value of the harmonized record for the month
          type: number
          minimum: 0
        low:
          description: Lower bound of the interval; equals `value` for the reference sensor
          type: number
          minimum: 0
        high:
          description: Upper bound of the interval; equals `value` for the reference sensor
          type: number
          minimum: 0
        median:
          description: Median of this calendar month over the baseline years
          type: [number, "null"]
        anomaly_pct:
          description: (value − median) / median × 100; `null` if the median is zero
          type: [number, "null"]
        percentile:
          description: Percentile of the value among the same months of the baseline years, 0–100
          type: [number, "null"]
          minimum: 0
          maximum: 100
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        source:
          $ref: "#/components/schemas/Source"
        preliminary:
          description: true — the month is computed from near-real-time data (NRT)
          type: boolean
        partial:
          description: true — the month is incomplete (the first or the current month of the record)
          type: boolean
        sensor_gap:
          description: |
            true — the regular lead source had a known outage in this month:
            the value comes from the substitute satellite (see `source`) or may be underestimated.
            The field is optional; when it is absent, it means false.
          type: boolean
        raw:
          description: Filled only when `series` = `raw`
          $ref: "#/components/schemas/RawValues"

    MonthBaseline:
      type: object
      additionalProperties: false
      required: [month, median, p10, p25, p75, p90, max, n_years]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        median:
          type: number
        p10:
          type: number
        p25:
          type: number
        p75:
          type: number
        p90:
          type: number
        max:
          type: number
        n_years:
          description: Number of baseline years used
          type: integer

    YearTotal:
      type: object
      additionalProperties: false
      required: [year, total, complete]
      properties:
        year:
          type: integer
        total:
          type: number
        complete:
          description: false — the year is incomplete (2000 and the current year)
          type: boolean

    CalendarSummary:
      type: object
      additionalProperties: false
      required: [peak_year, peak_month, total, trend_pct_per_decade]
      properties:
        peak_year:
          description: The most active complete year; `null` if the area has no fires
          type: [integer, "null"]
        peak_month:
          description: Calendar month with the highest median, 1–12
          type: [integer, "null"]
        total:
          description: Sum of the values over the selected period
          type: number
        trend_pct_per_decade:
          description: |
            Trend of the yearly totals, % per 10 years: the slope of a linear (least-squares) regression
            over the complete years of the period, multiplied by 10 and divided by the mean yearly total of those years.
            `null` if there are too few years.
          type: [number, "null"]
        trend_line:
          description: |
            The same trend line as two points — for the chart of yearly totals.
            The field is optional; `null` if `trend_pct_per_decade` is `null`.
          oneOf:
            - $ref: "#/components/schemas/TrendLine"
            - type: "null"

    TrendLine:
      description: Ends of the trend line of the yearly totals, in record units
      type: object
      additionalProperties: false
      required: [start_year, start_value, end_year, end_value]
      properties:
        start_year:
          description: First complete year of the period
          type: integer
        start_value:
          description: Value of the trend line in `start_year`
          type: number
        end_year:
          description: Last complete year of the period
          type: integer
        end_value:
          description: Value of the trend line in `end_year`
          type: number

    CalendarResponse:
      type: object
      additionalProperties: false
      required:
        - area_km2
        - cells
        - unit
        - metric
        - series
        - baseline
        - data_through
        - months
        - monthly_baseline
        - yearly
        - summary
        - warnings
      properties:
        area_km2:
          type: number
        cells:
          description: Number of grid cells inside the area
          type: integer
        unit:
          type: string
        metric:
          $ref: "#/components/schemas/Metric"
        series:
          $ref: "#/components/schemas/Series"
        baseline:
          description: Baseline period actually used
          $ref: "#/components/schemas/YearRange"
        data_through:
          description: Last day included in the calculation
          type: string
          format: date
        months:
          description: All months of the selected period in ascending date order
          type: array
          items:
            $ref: "#/components/schemas/MonthValue"
        monthly_baseline:
          description: Exactly 12 items, one per calendar month
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: "#/components/schemas/MonthBaseline"
        yearly:
          type: array
          items:
            $ref: "#/components/schemas/YearTotal"
        summary:
          $ref: "#/components/schemas/CalendarSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    SameDaysBaseline:
      description: Statistics for the same days of the month in the baseline years
      type: object
      additionalProperties: false
      required: [median, p25, p75, p90, max, n_years]
      properties:
        median:
          type: number
        p25:
          type: number
        p75:
          type: number
        p90:
          type: number
        max:
          type: number
        n_years:
          type: integer

    CumulativeDay:
      type: object
      additionalProperties: false
      required: [day, value, median]
      properties:
        day:
          description: Day of the month
          type: integer
          minimum: 1
          maximum: 31
        value:
          description: Cumulative value of the current month on this day
          type: number
        median:
          description: Median of the cumulative value on this day over the baseline years
          type: number

    CurrentResponse:
      type: object
      additionalProperties: false
      required:
        - as_of
        - year
        - month
        - days_elapsed
        - value
        - baseline_same_days
        - anomaly_pct
        - percentile
        - category
        - source
        - preliminary
        - cumulative
        - warnings
      properties:
        as_of:
          description: Last day with data
          type: string
          format: date
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        days_elapsed:
          description: Number of days of the month included in the calculation
          type: integer
          minimum: 1
          maximum: 31
        value:
          description: Value of the harmonized record since the start of the month
          type: number
          minimum: 0
        baseline_same_days:
          $ref: "#/components/schemas/SameDaysBaseline"
        anomaly_pct:
          type: [number, "null"]
        percentile:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        source:
          $ref: "#/components/schemas/Source"
        preliminary:
          type: boolean
        cumulative:
          description: Daily cumulative values — for the small chart on the "Now" panel
          type: array
          items:
            $ref: "#/components/schemas/CumulativeDay"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    PointProperties:
      description: Point properties in the common schema
      type: object
      additionalProperties: false
      required:
        - acq_datetime
        - sensor
        - satellite
        - conf_class
        - frp
        - daynight
        - quality
        - harmonized_weight
      properties:
        acq_datetime:
          type: string
          format: date-time
        sensor:
          type: string
          enum: [MODIS, VIIRS]
        satellite:
          description: T — Terra, A — Aqua, N — Suomi NPP, N20 — NOAA-20, N21 — NOAA-21
          type: string
          enum: [T, A, N, N20, N21]
        conf_class:
          type: string
          enum: [low, nominal, high]
        frp:
          description: Fire radiative power, MW
          type: [number, "null"]
        daynight:
          type: string
          enum: [D, N]
        quality:
          description: SP — standard processing, NRT — near-real-time data
          type: string
          enum: [SP, NRT]
        harmonized_weight:
          description: Contribution of the point to the harmonized record; 0 — the point is not from the lead source
          type: number
          minimum: 0

    PointFeature:
      type: object
      additionalProperties: false
      required: [type, geometry, properties]
      properties:
        type:
          const: Feature
        geometry:
          type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type:
              const: Point
            coordinates:
              $ref: "#/components/schemas/Position"
        properties:
          $ref: "#/components/schemas/PointProperties"

    PointsResponse:
      description: GeoJSON FeatureCollection with two extra fields
      type: object
      additionalProperties: false
      required: [type, features, total, truncated]
      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: "#/components/schemas/PointFeature"
        total:
          description: Total number of points matching the request
          type: integer
        truncated:
          description: true — only part of the points is returned (limit `max_points`)
          type: boolean

    DailyValue:
      type: object
      additionalProperties: false
      required: [date, value, preliminary]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          minimum: 0
        preliminary:
          type: boolean

    DailyResponse:
      type: object
      additionalProperties: false
      required: [year, unit, metric, days]
      properties:
        year:
          type: integer
        unit:
          type: string
        metric:
          $ref: "#/components/schemas/Metric"
        days:
          type: array
          items:
            $ref: "#/components/schemas/DailyValue"

    ValidationMetrics:
      type: object
      additionalProperties: false
      required: [pearson_r, bias_pct, mape_pct, n_months]
      properties:
        pearson_r:
          description: Correlation of the prediction and the observation by month
          type: number
        bias_pct:
          description: Systematic bias, %
          type: number
        mape_pct:
          description: Median absolute error, %
          type: number
        n_months:
          type: integer

    ValidationPoint:
      type: object
      additionalProperties: false
      required: [year, month, modis_raw, viirs_raw, harmonized]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        modis_raw:
          description: Raw MODIS (Terra + Aqua)
          type: [number, "null"]
        viirs_raw:
          description: Raw VIIRS Suomi NPP
          type: [number, "null"]
        harmonized:
          description: MODIS scaled by the coefficient — the prediction for VIIRS
          type: [number, "null"]

    ValidationRegion:
      type: object
      additionalProperties: false
      required: [id, name, metrics, series]
      properties:
        id:
          type: string
        name:
          type: string
        metrics:
          $ref: "#/components/schemas/ValidationMetrics"
        series:
          type: array
          items:
            $ref: "#/components/schemas/ValidationPoint"

    SeamTest:
      description: |
        Seam test: a ratio that is 1 when the record has no step at the seam.
        `modis_to_snpp_2012`: mean of 2012–2014 over the mean of 2009–2011, for the harmonized series
        (`ratio_harmonized`) and for the naive one, raw MODIS before and raw Suomi NPP after (`ratio_naive`).
        `snpp_to_n20_2026`: NOAA-20 over Suomi NPP on the same days of the overlap 2024–2025, with the
        NOAA-20 coefficient (`ratio_harmonized`) and without it (`ratio_naive`). The two sensors already
        agree closely, so here the naive ratio can be as close to 1 as the harmonized one.
      type: object
      additionalProperties: false
      required: [id, label, ratio_harmonized, ratio_naive]
      properties:
        id:
          type: string
          enum: [modis_to_snpp_2012, snpp_to_n20_2026]
        label:
          type: string
        ratio_harmonized:
          type: number
        ratio_naive:
          type: number

    ValidationResponse:
      type: object
      additionalProperties: false
      required: [calibration_period, test_period, regions, seams, limitations]
      properties:
        calibration_period:
          $ref: "#/components/schemas/YearRange"
        test_period:
          $ref: "#/components/schemas/YearRange"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/ValidationRegion"
        seams:
          type: array
          items:
            $ref: "#/components/schemas/SeamTest"
        limitations:
          type: array
          items:
            type: string
