# The frontend (static files) and /api/v1/* on one origin, so the API needs no CORS.
# TLS is terminated in front of this container (Coolify's Traefik).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/geo+json text/csv text/plain text/css
               application/javascript text/javascript image/svg+xml application/yaml;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # stream the CSV exports instead of buffering them in the container
        proxy_buffering off;
    }

    # hashed build files never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # routing is in the #fragment, so index.html is the only page
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
