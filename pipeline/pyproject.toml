[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firms-pipeline"
version = "0.1.0"
description = "FIRMS MODIS + VIIRS download, unified schema and harmonization"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8", "jsonschema[format]>=4.21", "pyyaml>=6.0"]

[tool.setuptools]
py-modules = ["download_archives", "to_parquet", "harmonize", "fetch_api", "api_to_parquet", "grid", "lead", "validation"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long SQL lines inside f-strings

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
